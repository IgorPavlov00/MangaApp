<!-- Supabase -> Authentication -> Emails -> "Reset password". Subject: Reset your AniMan password -->
<div style="margin:0;padding:32px 16px;background:#0c0b10;font-family:Segoe UI,Helvetica,Arial,sans-serif;color:#f3eee6">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#14121a;border:1px solid #2c2837;border-radius:16px">
    <tr>
      <td style="padding:32px 32px 8px">
        <span style="display:inline-block;width:36px;height:36px;line-height:36px;text-align:center;border-radius:9px;background:#ff5a36;color:#160805;font-size:20px;font-weight:700">漫</span>
        <span style="font-size:20px;font-weight:800;vertical-align:middle;margin-left:8px">AniMan</span>
      </td>
    </tr>
    <tr>
      <td style="padding:16px 32px 8px">
        <h1 style="margin:0;font-size:24px;line-height:1.25">Reset your password</h1>
        <p style="margin:14px 0 0;color:#a7a0b2;font-size:15px;line-height:1.6">
          Someone (hopefully you) asked to reset the password for this account. The link expires in one hour.
        </p>
      </td>
    </tr>
    <tr>
      <td style="padding:24px 32px">
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:13px 26px;border-radius:999px;background:#ff5a36;color:#160805;font-weight:800;text-decoration:none">Choose a new password</a>
      </td>
    </tr>
    <tr>
      <td style="padding:0 32px 32px;color:#6f6879;font-size:12px;line-height:1.6">
        If you didn't ask for this, you can ignore this email; your password won't change.
      </td>
    </tr>
  </table>
</div>
