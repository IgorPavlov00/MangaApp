# Netlify: builds the Angular frontend. Set SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY and API_URL
# under Site configuration -> Environment variables (read at build time by scripts/write-env.mjs).
[build]
  base = "manga-proj/frontend"
  command = "npm run build"
  publish = "dist/frontend/browser"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: let Angular's router handle every path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# Hashed bundles never change, so cache them for a year.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
