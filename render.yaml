# Render Blueprint for the Spring Boot API (Render dashboard -> New -> Blueprint -> this repo).
# Secrets are marked sync: false, so Render asks for them when the blueprint is created.
services:
  - type: web
    name: animan-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: manga-proj/manga
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://anime-manga-finder.netlify.app,http://localhost:4200
