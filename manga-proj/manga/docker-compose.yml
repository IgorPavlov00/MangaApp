# Local Postgres for development. In production the API uses Supabase Postgres instead.
services:
  postgres:
    image: postgres:17-alpine
    container_name: animan-postgres
    environment:
      POSTGRES_USER: animan
      POSTGRES_PASSWORD: animan
      POSTGRES_DB: animan
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres:
