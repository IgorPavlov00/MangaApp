# All environment-specific values come from environment variables (see .env.example).
# Defaults below target the local docker-compose Postgres.
spring:
  application:
    name: animan-api
  config:
    # Local development convenience: values from .env (same keys as .env.example).
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/animan}
    username: ${DATABASE_USERNAME:animan}
    password: ${DATABASE_PASSWORD:animan}
    hikari:
      # Supabase's session pooler (and the free tier) have tight connection limits.
      # During a Render deploy the old and new instances run side by side, and a local dev server
      # pointed at the same database counts too, so keep each instance small and release idle ones.
      maximum-pool-size: ${DATABASE_POOL_SIZE:4}
      minimum-idle: 1
      # Milliseconds: Hikari binds these as plain longs, not Durations.
      idle-timeout: 60000
      data-source-properties:
        # Supabase's transaction pooler (port 6543) hands each transaction a different server
        # connection, so server-side prepared statements can't be reused. Harmless elsewhere.
        prepareThreshold: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # Supabase pre-populates the public schema, so start history at version 0 and still run V1+.
    baseline-on-migrate: true
    baseline-version: 0
  http:
    clients:
      # Fail fast when Jikan hangs so the AniList fallback can answer instead.
      connect-timeout: 4s
      read-timeout: 8s
  cache:
    cache-names: jikan-recommendations
    caffeine:
      spec: maximumSize=500,expireAfterWrite=6h

server:
  port: ${PORT:8084}
  # Render/Netlify sit behind proxies; trust X-Forwarded-* headers.
  forward-headers-strategy: framework

app:
  supabase:
    url: ${SUPABASE_URL:http://localhost:54321}
    # Only for projects still on the legacy shared-secret (HS256) JWT signing. Leave empty otherwise.
    legacy-jwt-secret: ${SUPABASE_JWT_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jikan:
    base-url: https://api.jikan.moe/v4

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /docs
